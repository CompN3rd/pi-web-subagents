name: Adapter CI

on:
  pull_request:
    paths:
      - 'packages/pi-web-subagents/**'
      - '.github/workflows/adapter-ci.yml'
      - '.github/workflows/adapter-release.yml'
  push:
    branches: [main]
    paths:
      - 'packages/pi-web-subagents/**'
      - '.github/workflows/adapter-ci.yml'
      - '.github/workflows/adapter-release.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adapter:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: packages/pi-web-subagents
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: packages/pi-web-subagents/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack only the nested adapter and verify actual contents
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          npm run verify:release -- --tarball artifacts/compn3rd-pi-web-subagents-0.79.0.tgz
