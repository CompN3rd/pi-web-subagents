name: Adapter release

# No root release trigger, schedule, automatic versioning, or credentials fallback.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: adapter-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.ADAPTER_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: packages/pi-web-subagents
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: packages/pi-web-subagents/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Pack once and verify exact release input
        id: packed-input
        run: |
          mkdir -p artifacts
          npm pack --ignore-scripts --pack-destination artifacts
          npm run verify:release -- --tarball artifacts/compn3rd-pi-web-subagents-0.79.0.tgz
          echo "sha256=$(sha256sum artifacts/compn3rd-pi-web-subagents-0.79.0.tgz | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: packed
        with:
          name: adapter-package
          path: packages/pi-web-subagents/artifacts/compn3rd-pi-web-subagents-0.79.0.tgz
          if-no-files-found: error
          retention-days: 7
    outputs:
      artifact-id: ${{ steps.packed.outputs.artifact-id }}
      sha256: ${{ steps.packed-input.outputs.sha256 }}

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ADAPTER_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-latest
    # Owner must configure restricted branches and required reviewers before enabling.
    environment: adapter-release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: bash
        working-directory: packages/pi-web-subagents
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24.20.0'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          path: adapter-artifact
          merge-multiple: true
      - name: Recheck tarball without installing or executing package dependencies
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          echo "$EXPECTED_SHA256  $GITHUB_WORKSPACE/adapter-artifact/compn3rd-pi-web-subagents-0.79.0.tgz" | sha256sum --check --strict
          node scripts/verify-release.mjs --packed-only "$GITHUB_WORKSPACE/adapter-artifact/compn3rd-pi-web-subagents-0.79.0.tgz"
      - name: Publish only the verified scoped tarball using npm trusted publishing
        run: npm publish "$GITHUB_WORKSPACE/adapter-artifact/compn3rd-pi-web-subagents-0.79.0.tgz" --access public --provenance --ignore-scripts
